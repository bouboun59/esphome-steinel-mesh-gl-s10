substitutions:
  name: gl-s10-steinel
  friendly_name: Steinel
  project_name: "envpl.steinel_nightmatiq_gateway"
  project_version: "1.1.1-gls10"
  factory_username: "admin"
  factory_password: "12345678"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.7.3
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    then:
      - output.turn_on: power_led
      - lambda: |-
          id(nightmatiq_gateway).add_group(0xC001);
          id(nightmatiq_gateway).add_group(0xC000);  // INSTANT_V1 luminosite
          id(nightmatiq_gateway).add_lamp(0x0013, 3);
          id(nightmatiq_gateway).add_lamp(0x0017, 3);
          id(nightmatiq_gateway).set_primary_tag(0x308A);
          id(nightmatiq_gateway).add_lc_props(0x000F);
          id(nightmatiq_gateway).add_lc_props(0x0013);
          id(nightmatiq_gateway).add_lc_props(0x0017);
          id(nightmatiq_gateway).set_lamp_tag(0x0013, 0xD58E);
          id(nightmatiq_gateway).set_lamp_tag(0x0017, 0xA52C);
          id(nightmatiq_gateway).set_primary_name("Applique Entrée");
          id(nightmatiq_gateway).set_lamp_name(0x0013, "Applique Devant");
          id(nightmatiq_gateway).set_lamp_name(0x0017, "Applique Garage");

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLUEDROID_ENABLED: y
      CONFIG_BT_NIMBLE_ENABLED: n
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: n
      CONFIG_BT_BLE_50_EXTEND_ADV_EN: n
      CONFIG_BT_BLE_50_EXTEND_SCAN_EN: n
      CONFIG_BT_BLE_50_EXTEND_SYNC_EN: n
      CONFIG_BT_BLE_50_PERIODIC_ADV_EN: n
      CONFIG_BT_BLE_50_DTM_TEST_EN: n
      CONFIG_BLE_MESH: y
      CONFIG_BLE_MESH_PROVISIONER: y
      CONFIG_BLE_MESH_SETTINGS: y
      CONFIG_BLE_MESH_PB_ADV: y
      CONFIG_BLE_MESH_SUPPORT_BLE_SCAN: y
      CONFIG_BLE_MESH_ADV_BUF_COUNT: "6"
      CONFIG_BLE_MESH_CRPL: "16"
      CONFIG_BLE_MESH_MSG_CACHE_SIZE: "2"
      CONFIG_BLE_MESH_WAIT_FOR_PROV_MAX_DEV_NUM: "1"
      CONFIG_BLE_MESH_MAX_PROV_NODES: "4"
      CONFIG_BLE_MESH_PBA_SAME_TIME: "1"
      CONFIG_BLE_MESH_PROVISIONER_SUBNET_COUNT: "1"
      CONFIG_BLE_MESH_PROVISIONER_APP_KEY_COUNT: "1"
      CONFIG_BLE_MESH_SUBNET_COUNT: "1"
      CONFIG_BLE_MESH_APP_KEY_COUNT: "1"
      CONFIG_BLE_MESH_MODEL_KEY_COUNT: "1"
      CONFIG_BLE_MESH_MODEL_GROUP_COUNT: "2"
      CONFIG_BLE_MESH_LABEL_COUNT: "1"
      CONFIG_BLE_MESH_CFG_CLI: y
      CONFIG_BLE_MESH_GENERIC_ONOFF_CLI: y
      CONFIG_BLE_MESH_SENSOR_CLI: y
      CONFIG_BLE_MESH_SCENE_CLI: y
      CONFIG_BLE_MESH_LIGHT_LC_CLI: y
      CONFIG_BLE_MESH_LIGHT_LIGHTNESS_CLI: y
      CONFIG_BLE_MESH_HEALTH_SRV: n
      CONFIG_BLE_MESH_PROXY: n
      CONFIG_BLE_MESH_TX_SEG_MSG_COUNT: "1"
      CONFIG_BLE_MESH_TX_SEG_MAX: "3"
      CONFIG_BLE_MESH_RX_SEG_MSG_COUNT: "1"
      CONFIG_BLE_MESH_RX_SDU_MAX: "128"
      CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE: n
      CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_DISABLE: y
      CONFIG_ESP_ERR_TO_NAME_LOOKUP: n
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: y
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT: y
      CONFIG_MBEDTLS_SERVER_SSL_SESSION_TICKETS: n
      CONFIG_MBEDTLS_PEM_WRITE_C: n
      CONFIG_MBEDTLS_X509_CRL_PARSE_C: n
      CONFIG_MBEDTLS_X509_CSR_PARSE_C: n
      CONFIG_MBEDTLS_ECDSA_DETERMINISTIC: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_RSA: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_RSA: n
      CONFIG_MBEDTLS_ECP_DP_BP256R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_BP384R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_BP512R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP192K1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP192R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP224K1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP224R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP256K1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP521R1_ENABLED: n
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

preferences:
  flash_write_interval: 5s

ethernet:
  id: eth
  type: IP101
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO5
  use_address: 192.168.1.58

external_components:
  - source:
      type: local
      path: components
    components: [nightmatiq_mesh]

nightmatiq_mesh:
  id: nightmatiq_gateway
  extended_diagnostics: true
  lux_sensor_id: nightmatiq_lux
  rssi_sensor_id: nightmatiq_rssi
  threshold_number_id: nightmatiq_threshold
  mode_select_id: nightmatiq_mode
  ready_binary_sensor_id: nightmatiq_mesh_ready
  actual_output_binary_sensor_id: nightmatiq_actual_output
  status_text_sensor_id: nightmatiq_status
  firmware_version_text_sensor_id: nightmatiq_firmware_version
  hardware_version_sensor_id: nightmatiq_hardware_version
  manufacturer_text_sensor_id: nightmatiq_manufacturer
  company_id_text_sensor_id: nightmatiq_company_id
  product_id_text_sensor_id: nightmatiq_product_id
  ota_id: nightmatiq_ota
  web_username: "${factory_username}"
  web_password: "${factory_password}"
  update_interval: 30s

logger:
  level: DEBUG
  logs:
    esp-idf: INFO

api:
  id: api_server
  reboot_timeout: 0s
  max_connections: 2
  listen_backlog: 1
  max_send_queue: 4
  batch_delay: 500ms

ota:
  - platform: web_server
  - platform: esphome
    id: nightmatiq_ota
    password: !secret ota_password

mdns:
  disabled: false

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: "${factory_username}"
    password: "${factory_password}"


output:
  - platform: gpio
    pin: GPIO32
    inverted: true
    id: network_led
  - platform: gpio
    pin: GPIO14
    inverted: true
    id: power_led
  - platform: gpio
    pin: GPIO12
    inverted: true
    id: bluetooth_led

binary_sensor:
  - platform: template
    name: "Applique Devant Lumière"
    icon: mdi:lightbulb
    lambda: |-
      const int v = id(nightmatiq_gateway).lamp_output(0x0013);
      if (v < 0) return {};
      return v == 1;
  - platform: template
    name: "Applique Devant Mouvement"
    device_class: motion
    lambda: |-
      const int v = id(nightmatiq_gateway).lamp_motion(0x0013);
      if (v < 0 || v == 0xFF) return {};
      return v > 0;
    filters:
      - delayed_off: 10s
  - platform: template
    name: "Applique Garage Lumière"
    icon: mdi:lightbulb
    lambda: |-
      const int v = id(nightmatiq_gateway).lamp_output(0x0017);
      if (v < 0) return {};
      return v == 1;
  - platform: template
    name: "Applique Garage Mouvement"
    device_class: motion
    lambda: |-
      const int v = id(nightmatiq_gateway).lamp_motion(0x0017);
      if (v < 0 || v == 0xFF) return {};
      return v > 0;
    filters:
      - delayed_off: 10s
  - platform: template
    id: steinel_motion
    name: "Applique Entrée Mouvement"
    device_class: motion
    lambda: |-
      const int v = id(nightmatiq_gateway).motion_raw();
      if (v < 0 || v == 0xFF) return {};
      return v > 0;
    filters:
      - delayed_off: 10s
  - platform: gpio
    pin:
      number: GPIO33
      inverted: true
    name: "Reset Button"
  - platform: template
    id: nightmatiq_mesh_ready
    name: "Gateway Mesh Ready"
    entity_category: diagnostic
  - platform: template
    id: nightmatiq_actual_output
    name: "Applique Entrée Lumière"
    icon: mdi:lightbulb

button:
  - platform: safe_mode
    name: Safe Mode Boot
    entity_category: diagnostic
  - platform: template
    name: "Gateway Refresh"
    icon: mdi:refresh
    entity_category: diagnostic
    on_press:
      - lambda: 'id(nightmatiq_gateway).request_refresh();'

sensor:
  - platform: template
    name: "Applique Devant Mouvement niveau"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s
    entity_category: diagnostic
    lambda: |-
      static int last = -2;
      const int v = id(nightmatiq_gateway).lamp_motion(0x0013);
      if (v < 0 || v == 0xFF || v == last) return {};
      last = v;
      return v / 2.0f;
    filters:
      - delta: 0.4
  - platform: template
    name: "Applique Devant Révision matérielle"
    accuracy_decimals: 0
    update_interval: 1s
    entity_category: diagnostic
    lambda: |-
      static float last = NAN;
      const float v = id(nightmatiq_gateway).lamp_hardware(0x0013);
      if (std::isnan(v) || v == last) return {};
      last = v;
      return v;
  - platform: template
    name: "Applique Devant Signal"
    device_class: signal_strength
    state_class: measurement
    unit_of_measurement: dBm
    accuracy_decimals: 0
    update_interval: 1s
    entity_category: diagnostic
    lambda: |-
      static float last = NAN;
      const float v = id(nightmatiq_gateway).lamp_rssi(0x0013);
      if (std::isnan(v) || v == last) return {};
      last = v;
      return v;
    filters:
      - throttle_average: 60s
      - delta: 2
  - platform: template
    name: "Applique Garage Mouvement niveau"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s
    entity_category: diagnostic
    lambda: |-
      static int last = -2;
      const int v = id(nightmatiq_gateway).lamp_motion(0x0017);
      if (v < 0 || v == 0xFF || v == last) return {};
      last = v;
      return v / 2.0f;
    filters:
      - delta: 0.4
  - platform: template
    name: "Applique Garage Révision matérielle"
    accuracy_decimals: 0
    update_interval: 1s
    entity_category: diagnostic
    lambda: |-
      static float last = NAN;
      const float v = id(nightmatiq_gateway).lamp_hardware(0x0017);
      if (std::isnan(v) || v == last) return {};
      last = v;
      return v;
  - platform: template
    name: "Applique Garage Signal"
    device_class: signal_strength
    state_class: measurement
    unit_of_measurement: dBm
    accuracy_decimals: 0
    update_interval: 1s
    entity_category: diagnostic
    lambda: |-
      static float last = NAN;
      const float v = id(nightmatiq_gateway).lamp_rssi(0x0017);
      if (std::isnan(v) || v == last) return {};
      last = v;
      return v;
    filters:
      - throttle_average: 60s
      - delta: 2
  - platform: template
    name: "Applique Devant Luminosité"
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      static float last = NAN;
      const float v = id(nightmatiq_gateway).lamp_lux(0x0013);
      if (std::isnan(v) || v == last) return {};
      last = v;
      return v;
    filters:
      - delta: 0.5
  - platform: template
    name: "Applique Garage Luminosité"
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      static float last = NAN;
      const float v = id(nightmatiq_gateway).lamp_lux(0x0017);
      if (std::isnan(v) || v == last) return {};
      last = v;
      return v;
    filters:
      - delta: 0.5
  - platform: template
    id: steinel_motion_level
    name: "Applique Entrée Mouvement niveau"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s
    entity_category: diagnostic
    lambda: |-
      static int last = -2;
      const int v = id(nightmatiq_gateway).motion_raw();
      if (v < 0 || v == 0xFF || v == last) return {};
      last = v;
      return v / 2.0f;
    filters:
      - delta: 0.4
  - platform: template
    id: nightmatiq_rssi
    filters:
      - throttle_average: 60s
      - delta: 2
    name: "Applique Entrée Signal"
    device_class: signal_strength
    state_class: measurement
    unit_of_measurement: dBm
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: nightmatiq_hardware_version
    name: "Applique Entrée Révision matérielle"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: nightmatiq_lux
    filters:
      - delta: 0.5
    name: "Applique Entrée Luminosité"
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 2
    update_interval: never

number:
  - platform: template
    name: "Applique Entrée Intensité"
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: slider
    update_interval: 1s
    lambda: |-
      static float last = NAN;
      const float v = id(nightmatiq_gateway).lamp_lightness(0x000F);
      if (std::isnan(v) || v == last) return {};
      last = v;
