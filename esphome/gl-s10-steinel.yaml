select:
  - platform: template
    name: "Applique Devant Mode"
    icon: mdi:theme-light-dark
    options: ["Auto", "Always On", "Always Off"]
    update_interval: 1s
    lambda: |-
      static std::string last;
      auto *m = id(nightmatiq_gateway);
      const int lc = m->lamp_lc_mode(0x0013);
      const int out = m->lamp_output(0x0013);
      std::string v;
      if (lc == 1) v = "Auto";
      else if (lc == 0 && out == 1) v = "Always On";
      else if (lc == 0 && out == 0) v = "Always Off";
      if (v.empty() || v == last) return {};
      last = v;
      return v;
    set_action:
      - lambda: 'id(nightmatiq_gateway).set_lamp_mode(0x0013, x);'
  - platform: template
    name: "Applique Garage Mode"
    icon: mdi:theme-light-dark
    options: ["Auto", "Always On", "Always Off"]
    update_interval: 1s
    lambda: |-
      static std::string last;
      auto *m = id(nightmatiq_gateway);
      const int lc = m->lamp_lc_mode(0x0017);
      const int out = m->lamp_output(0x0017);
      std::string v;
      if (lc == 1) v = "Auto";
      else if (lc == 0 && out == 1) v = "Always On";
      else if (lc == 0 && out == 0) v = "Always Off";
      if (v.empty() || v == last) return {};
      last = v;
      return v;
    set_action:
      - lambda: 'id(nightmatiq_gateway).set_lamp_mode(0x0017, x);'
  - platform: template
    id: nightmatiq_mode
    name: "Applique Entrée Mode"
    icon: mdi:theme-light-dark
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options:
      - "Auto"
      - "Always On"
      - "Always Off"
    set_action:
      - lambda: 'id(nightmatiq_gateway).set_mode(x);'

