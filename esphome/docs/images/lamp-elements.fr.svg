<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Bluetooth Mesh elements of a Steinel luminaire">
<title>Bluetooth Mesh elements of a Steinel luminaire</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="0" y="0" width="1000" height="480" rx="14" fill="#ffffff" stroke="#d5dae1"/>
<text x="30" y="42" font-size="20" font-weight="bold" fill="#1d2330" text-anchor="start">Dans une Steinel L42 SC / L 810 SC (4 éléments Bluetooth Mesh)</text>
<rect x="30" y="70" width="200" height="78" rx="10" fill="#fff6e0" stroke="#d98b00" stroke-width="1.6"/>
<text x="130" y="102" font-size="14" font-weight="bold" fill="#1d2330" text-anchor="middle">Élément 0 · base</text>
<text x="130" y="124" font-size="13" font-weight="normal" fill="#5f6b7a" text-anchor="middle">Sortie lumière</text>
<rect x="250" y="70" width="380" height="78" rx="10" fill="#f4f5f7" stroke="#d5dae1" stroke-width="1.6"/>
<text x="268" y="102" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Generic OnOff 1000 · Light Lightness 1300</text>
<text x="268" y="124" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Scene 1203 · Time 1200 · Scheduler 1206</text>
<line x1="632" y1="109" x2="688" y2="109" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="690" y="70" width="280" height="78" rx="10" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.6"/>
<text x="708" y="102" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Lumière (allumée / éteinte)</text>
<text x="708" y="124" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Intensité (variation en direct)</text>
<rect x="30" y="165" width="200" height="78" rx="10" fill="#fff6e0" stroke="#d98b00" stroke-width="1.6"/>
<text x="130" y="197" font-size="14" font-weight="bold" fill="#1d2330" text-anchor="middle">Élément 1 · base + 1</text>
<text x="130" y="219" font-size="13" font-weight="normal" fill="#5f6b7a" text-anchor="middle">Light LC (logique détecteur)</text>
<rect x="250" y="165" width="380" height="78" rx="10" fill="#f4f5f7" stroke="#d5dae1" stroke-width="1.6"/>
<text x="268" y="197" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">LC Server 130F / Setup 1310</text>
<text x="268" y="219" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Properties 0x002B 0x002E 0x0030 0x003C</text>
<line x1="632" y1="204" x2="688" y2="204" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="690" y="165" width="280" height="78" rx="10" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.6"/>
<text x="708" y="197" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Mode (Auto / On / Off)</text>
<text x="708" y="219" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Seuil · Puissance · Veille · Tempo</text>
<rect x="30" y="260" width="200" height="78" rx="10" fill="#fff6e0" stroke="#d98b00" stroke-width="1.6"/>
<text x="130" y="292" font-size="14" font-weight="bold" fill="#1d2330" text-anchor="middle">Élément 2 · base + 2</text>
<text x="130" y="314" font-size="13" font-weight="normal" fill="#5f6b7a" text-anchor="middle">Capteur de mouvement</text>
<rect x="250" y="260" width="380" height="78" rx="10" fill="#f4f5f7" stroke="#d5dae1" stroke-width="1.6"/>
<text x="268" y="292" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Sensor 1100 · property 0x0042</text>
<text x="268" y="314" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">publie vers le groupe 0xC001</text>
<line x1="632" y1="299" x2="688" y2="299" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="690" y="260" width="280" height="78" rx="10" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.6"/>
<text x="708" y="292" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Mouvement (instantané, 10 s)</text>
<text x="708" y="314" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Niveau de mouvement %</text>
<rect x="30" y="355" width="200" height="78" rx="10" fill="#fff6e0" stroke="#d98b00" stroke-width="1.6"/>
<text x="130" y="387" font-size="14" font-weight="bold" fill="#1d2330" text-anchor="middle">Élément 3 · base + 3</text>
<text x="130" y="409" font-size="13" font-weight="normal" fill="#5f6b7a" text-anchor="middle">Capteur de luminosité</text>
<rect x="250" y="355" width="380" height="78" rx="10" fill="#f4f5f7" stroke="#d5dae1" stroke-width="1.6"/>
<text x="268" y="387" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Sensor 1100 · property 0x004E</text>
<text x="268" y="409" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">publie vers le groupe 0xC000</text>
<line x1="632" y1="394" x2="688" y2="394" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="690" y="355" width="280" height="78" rx="10" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.6"/>
<text x="708" y="387" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Luminosité (lx)</text>
<text x="708" y="409" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">0xFFFFFF = inconnue, ignorée</text>
<text x="430" y="462" font-size="12" font-weight="bold" fill="#5f6b7a" text-anchor="middle">Modèles Mesh</text>
<text x="830" y="462" font-size="12" font-weight="bold" fill="#5f6b7a" text-anchor="middle">Entités Home Assistant</text>
</svg>
