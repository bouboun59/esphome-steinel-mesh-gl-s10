<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Serial wiring between a USB-TTL adapter and the GL-S10">
<title>Serial wiring between a USB-TTL adapter and the GL-S10</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="0" y="0" width="1000" height="420" rx="14" fill="#ffffff" stroke="#d5dae1"/>
<text x="30" y="42" font-size="20" font-weight="bold" fill="#1d2330" text-anchor="start">Flash série du GL-S10 (installation / récupération)</text>
<rect x="30" y="70" width="240" height="250" rx="10" fill="#f4f5f7" stroke="#2b323b" stroke-width="1.6"/>
<text x="150" y="98" font-size="16" font-weight="bold" fill="#1d2330" text-anchor="middle">Adaptateur USB-TTL</text>
<text x="150" y="118" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="middle">FTDI / CP2102 · 3.3 V</text>
<rect x="620" y="70" width="350" height="250" rx="10" fill="#e9f7ef" stroke="#1f9d55" stroke-width="1.6"/>
<text x="795" y="98" font-size="16" font-weight="bold" fill="#1d2330" text-anchor="middle">Carte GL-S10 (connecteur 9 trous)</text>
<text x="250" y="165" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="end">GND</text>
<text x="640" y="165" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="start">GND</text>
<line x1="262" y1="160" x2="628" y2="160" stroke="#5f6b7a" stroke-width="3"/>
<text x="250" y="210" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="end">TXD</text>
<text x="640" y="210" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="start">RX</text>
<line x1="262" y1="205" x2="628" y2="205" stroke="#1f9d55" stroke-width="3"/>
<text x="250" y="255" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="end">RXD</text>
<text x="640" y="255" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="start">TX</text>
<line x1="262" y1="250" x2="628" y2="250" stroke="#d6452b" stroke-width="3"/>
<text x="250" y="300" font-size="13" font-weight="normal" fill="#c93a58" text-anchor="end">VCC : non branché</text>
<text x="640" y="300" font-size="13" font-weight="normal" fill="#5f6b7a" text-anchor="start">Bouton IO0 maintenu à l’allumage = mode flash</text>
<rect x="30" y="345" width="240" height="55" rx="10" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.6"/>
<text x="150" y="368" font-size="12" font-weight="normal" fill="#1d2330" text-anchor="middle">USB → ordinateur</text>
<text x="150" y="386" font-size="12" font-weight="normal" fill="#1d2330" text-anchor="middle">/dev/cu.usbserial-… · /dev/ttyUSB0</text>
<rect x="620" y="345" width="350" height="55" rx="10" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.6"/>
<text x="795" y="368" font-size="12" font-weight="normal" fill="#1d2330" text-anchor="middle">Alimentation USB par le MÊME ordinateur</text>
<text x="795" y="386" font-size="12" font-weight="normal" fill="#1d2330" text-anchor="middle">PoE : jamais USB et PoE ensemble</text>
</svg>
