<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Meaning of the GL-S10 front LEDs">
<title>Meaning of the GL-S10 front LEDs</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="0" y="0" width="1000" height="290" rx="14" fill="#ffffff" stroke="#d5dae1"/>
<text x="30" y="42" font-size="20" font-weight="bold" fill="#1d2330" text-anchor="start">GL-S10 front LEDs (this firmware)</text>
<rect x="30" y="70" width="300" height="200" rx="24" fill="#f1f3f5" stroke="#2b323b" stroke-width="1.6"/>
<text x="180" y="104" font-size="16" font-weight="bold" fill="#5f6b7a" text-anchor="middle">GL-S10</text>
<circle cx="80" cy="140" r="11" fill="#f4b400" stroke="#2b323b" stroke-width="1.5"/>
<text x="104" y="145" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="start">Power</text>
<circle cx="80" cy="182" r="11" fill="#ffffff" stroke="#2b323b" stroke-width="1.5"/>
<text x="104" y="187" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="start">Network</text>
<circle cx="80" cy="224" r="11" fill="#1f6fd6" stroke="#2b323b" stroke-width="1.5"/>
<text x="104" y="229" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="start">Bluetooth</text>
<text x="360" y="82" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="start">Power (GPIO14)</text>
<text x="372" y="104" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">On as soon as the firmware runs</text>
<text x="360" y="138" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="start">Network (GPIO32)</text>
<text x="372" y="160" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Solid: Ethernet + Home Assistant connected</text>
<text x="372" y="180" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Flash every 2 s: Ethernet, no Home Assistant</text>
<text x="372" y="200" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">1 Hz blink: no Ethernet · fast blink: error</text>
<text x="360" y="234" font-size="15" font-weight="bold" fill="#1d2330" text-anchor="start">Bluetooth (GPIO12)</text>
<text x="372" y="256" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">Solid: Bluetooth Mesh ready</text>
<text x="372" y="276" font-size="13" font-weight="normal" fill="#1d2330" text-anchor="start">1 Hz blink: Mesh starting / not ready</text>
</svg>
